# Tes otomatis tiap kali kode dikirim ke GitHub, supaya perubahan yang merusak ketahuan lebih dulu.
name: Tes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pasang kebutuhan
        run: pip install -r requirements-dev.txt
      - name: Jalankan tes
        run: python -m pytest
      - name: Cek script deploy (bash)
        run: bash -n deploy/*.sh
